<svg xmlns="http://www.w3.org/2000/svg" width="96" height="20" viewBox="0 0 96 20">
<!-- Aero caption buttons: minimise, maximise, close. Decorative only. -->
<defs>
  <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#fff" stop-opacity=".62"/>
    <stop offset=".46" stop-color="#fff" stop-opacity=".26"/>
    <stop offset=".5" stop-color="#fff" stop-opacity=".04"/>
    <stop offset="1" stop-color="#fff" stop-opacity=".28"/>
  </linearGradient>
  <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="#eeb3a3"/>
    <stop offset=".46" stop-color="#d9826b"/>
    <stop offset=".5" stop-color="#c13a1e"/>
    <stop offset="1" stop-color="#d4502f"/>
  </linearGradient>
  <radialGradient id="redglow" cx=".5" cy="1" r=".6">
    <stop offset="0" stop-color="#ffd27a" stop-opacity=".85"/>
    <stop offset="1" stop-color="#ffb070" stop-opacity="0"/>
  </radialGradient>
  <clipPath id="shape"><path d="M0.5 0 H95.5 V15 Q95.5 19.5 91 19.5 H5 Q0.5 19.5 0.5 15 Z"/></clipPath>
</defs>
<g clip-path="url(#shape)">
  <rect x="0" y="0" width="53" height="20" fill="#3d6a92" fill-opacity=".45"/>
  <rect x="0" y="0" width="53" height="20" fill="url(#glass)"/>
  <rect x="53" y="0" width="43" height="20" fill="url(#red)"/>
  <rect x="53" y="0" width="43" height="20" fill="url(#redglow)"/>
  <!-- inner highlight -->
  <path d="M1.5 0 V15 Q1.5 18.5 5 18.5 H91 Q94.5 18.5 94.5 15 V0" fill="none" stroke="#fff" stroke-opacity=".45"/>
  <!-- separators -->
  <path d="M27 0 V20 M53 0 V20" stroke="#000" stroke-opacity=".55"/>
  <path d="M28 0 V20 M54 0 V20" stroke="#fff" stroke-opacity=".3"/>
</g>
<path d="M0.5 0 V15 Q0.5 19.5 5 19.5 H91 Q95.5 19.5 95.5 15 V0" fill="none" stroke="#0b1a2a" stroke-opacity=".8"/>
<!-- minimise -->
<rect x="9" y="10.5" width="9" height="3" fill="#fff" stroke="#14273a" stroke-width="1" stroke-opacity=".85"/>
<!-- maximise -->
<rect x="35" y="4.5" width="10" height="8" fill="none" stroke="#14273a" stroke-width="3.2" stroke-opacity=".85"/>
<rect x="35" y="4.5" width="10" height="8" fill="none" stroke="#fff" stroke-width="1.4"/>
<rect x="35" y="4" width="10" height="2" fill="#fff"/>
<!-- close -->
<path d="M70 5.5 L79 13.5 M79 5.5 L70 13.5" stroke="#4a0d00" stroke-width="4.2" stroke-linecap="round" stroke-opacity=".75"/>
<path d="M70 5.5 L79 13.5 M79 5.5 L70 13.5" stroke="#fff" stroke-width="2" stroke-linecap="round"/>
</svg>
