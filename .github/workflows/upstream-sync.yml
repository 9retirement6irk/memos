# Once a day, merges new usememos/memos commits into a sync/upstream branch
# and opens (or updates) a pull request to main, so every upstream update is
# reviewed before it reaches the image. Needs "Allow GitHub Actions to create
# and approve pull requests" under Settings → Actions → General.
name: Upstream Sync

on:
  schedule:
    - cron: "17 7 * * *"
  workflow_dispatch:

concurrency:
  group: upstream-sync
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Merge upstream main
        id: merge
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/usememos/memos.git
          git fetch --no-tags upstream main
          behind=$(git rev-list --count HEAD..upstream/main)
          echo "behind=$behind" >> "$GITHUB_OUTPUT"
          if [ "$behind" = "0" ]; then
            echo "Already up to date with upstream."
            exit 0
          fi
          git switch -C sync/upstream
          if ! git merge --no-edit upstream/main; then
            git merge --abort
            echo "::error::Upstream changes conflict with main. Merge upstream/main by hand."
            exit 1
          fi
          git push --force origin sync/upstream

      - name: Open or update the pull request
        if: steps.merge.outputs.behind != '0'
        env:
          GH_TOKEN: ${{ github.token }}
          BEHIND: ${{ steps.merge.outputs.behind }}
        run: |
          title="Sync with upstream memos ($BEHIND new commits)"
          body="Merges the latest usememos/memos main into this repo. Review the changes, then merge to rebuild the image."
          number=$(gh pr list --head sync/upstream --base main --state open --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh pr edit "$number" --title "$title" --body "$body"
          else
            gh pr create --head sync/upstream --base main --title "$title" --body "$body"
          fi
